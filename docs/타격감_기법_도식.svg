<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="sans-serif">
<rect width="960" height="640" fill="#fafafa"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#222">갑옷 파괴 순간 타격감 연출 (실시간 기준)</text>
<text x="30" y="64" font-size="13" fill="#555">그로기 시작 = 갑옷 파괴 = BreakArmor 호출 시점이 0초. 일반 타격에는 쓰지 않고 파괴 순간에만 한 번에 사용.</text>
