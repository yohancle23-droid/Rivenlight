<text x="540" y="82" font-size="12" text-anchor="middle" fill="#666">0.6s</text>
<line x1="620" y1="90" x2="620" y2="520" stroke="#ddd"/>
<text x="620" y="82" font-size="12" text-anchor="middle" fill="#666">0.8s</text>
<line x1="700" y1="90" x2="700" y2="520" stroke="#ddd"/>
