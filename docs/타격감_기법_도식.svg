<text x="816" y="332" font-size="12" fill="#333">대기</text>
<text x="30" y="368" font-size="14" font-weight="bold" fill="#222">⑦ 갑옷 낙하</text>
<text x="30" y="384" font-size="11" fill="#666">복제 메시 + 물리</text>
<rect x="340" y="356" width="468" height="26" rx="4" fill="#bdbdbd"/>
<text x="816" y="374" font-size="12" fill="#333">대기</text>
<text x="30" y="410" font-size="14" font-weight="bold" fill="#222">⑧ 플레이어 넉백</text>
<text x="30" y="426" font-size="11" fill="#666">Launch Character</text>
<rect x="300" y="398" width="160" height="26" rx="4" fill="#bdbdbd"/>
<text x="468" y="416" font-size="12" fill="#333">대기</text>
<text x="30" y="452" font-size="14" font-weight="bold" fill="#222">⑨ 보스 본 경직</text>
<text x="30" y="468" font-size="11" fill="#666">상체 흔들림</text>
<rect x="300" y="440" width="240" height="26" rx="4" fill="#bdbdbd"/>
<text x="548" y="458" font-size="12" fill="#333">대기</text>
<text x="30" y="494" font-size="14" font-weight="bold" fill="#222">⑩ 사운드</text>
<text x="30" y="510" font-size="11" fill="#666">파괴음 · 저음 임팩트</text>
<rect x="300" y="482" width="120" height="26" rx="4" fill="#bdbdbd"/>
<text x="428" y="500" font-size="12" fill="#333">대기</text>
<text x="30" y="560" font-size="13" fill="#222">초록 = 완료 · 노랑 = 진행 예정 · 회색 = 대기/꺼짐</text>
<text x="30" y="584" font-size="13" fill="#222">구간 길이는 히트스톱(0.6초)+슬로모션(0.67초)에 맞춘 배치이고, 대기 항목의 길이는 임시값.</text>
<text x="30" y="608" font-size="13" fill="#222">호출 순서: BreakArmor 끝 → (셰이크) → FOVPunch → BreakHitStop</text>
</svg>