<text x="780" y="82" font-size="12" text-anchor="middle" fill="#666">1.2s</text>
<line x1="860" y1="90" x2="860" y2="520" stroke="#ddd"/>
<text x="860" y="82" font-size="12" text-anchor="middle" fill="#666">1.4s</text>
<text x="30" y="116" font-size="14" font-weight="bold" fill="#222">① 히트스톱</text>
<text x="30" y="132" font-size="11" fill="#666">0.02배 · 실시간 0.6초</text>
<rect x="300" y="104" width="240" height="26" rx="4" fill="#2e7d32"/>
<text x="548" y="122" font-size="12" fill="#333">완료</text>
<text x="30" y="158" font-size="14" font-weight="bold" fill="#222">② 슬로모션 꼬리</text>
<text x="30" y="174" font-size="11" fill="#666">0.3배 · 실시간 약 0.67초</text>
<rect x="540" y="146" width="268" height="26" rx="4" fill="#2e7d32"/>
<text x="816" y="164" font-size="12" fill="#333">완료</text>
<text x="30" y="200" font-size="14" font-weight="bold" fill="#222">③ 카메라 셰이크</text>
<text x="30" y="216" font-size="11" fill="#666">CS_PlayerHit Scale 3.0</text>
<rect x="300" y="188" width="320" height="26" rx="4" fill="#9e9e9e"/>
<text x="628" y="206" font-size="12" fill="#333">노드 있음 · 현재 OFF</text>
<text x="30" y="242" font-size="14" font-weight="bold" fill="#222">④ FOV 펀치</text>
<text x="30" y="258" font-size="11" fill="#666">90 → 75 → 90</text>
<rect x="300" y="230" width="240" height="26" rx="4" fill="#2e7d32"/>
<text x="548" y="248" font-size="12" fill="#333">완료</text>
<text x="30" y="284" font-size="14" font-weight="bold" fill="#222">⑤ 히트 플래시</text>
<text x="30" y="300" font-size="11" fill="#666">Armor 머티리얼 FlashAmount</text>
<rect x="300" y="272" width="120" height="26" rx="4" fill="#f9a825"/>
<text x="428" y="290" font-size="12" fill="#333">다음</text>
<text x="30" y="326" font-size="14" font-weight="bold" fill="#222">⑥ 어깨 FX</text>
<text x="30" y="342" font-size="11" fill="#666">타락한 빛 · 20초 유지</text>
