<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Malgun Gothic','Noto Sans CJK KR',sans-serif">
<rect width="960" height="620" fill="#14161a"/>
<text x="30" y="38" fill="#fff" font-size="22" font-weight="bold">보스 피격 FX 계획 (P_HitSpot, 직접 제작)</text>
<text x="30" y="62" fill="#9aa" font-size="13">수치는 시작값 [미확인] · 화면 보고 조정</text>

<!-- 왼쪽: 형태 -->
<rect x="30" y="85" width="420" height="300" rx="10" fill="#1d2026" stroke="#3a3f48"/>
<text x="46" y="112" fill="#ffd27a" font-size="15" font-weight="bold">① 형태 (맞은 자리 한 점에서 터짐)</text>
<ellipse cx="240" cy="270" rx="95" ry="85" fill="#2a2e36" stroke="#444"/>
<text x="240" y="275" fill="#667" font-size="12" text-anchor="middle">보스 몸</text>
<!-- spark lines -->
<g stroke="#ffb347" stroke-width="2" stroke-linecap="round">
<line x1="320" y1="200" x2="365" y2="165"/><line x1="320" y1="200" x2="372" y2="205"/>
<line x1="320" y1="200" x2="355" y2="240"/><line x1="320" y1="200" x2="330" y2="150"/>
<line x1="320" y1="200" x2="285" y2="160"/><line x1="320" y1="200" x2="290" y2="235"/>
</g>
<circle cx="320" cy="200" r="22" fill="#fff6d8" opacity="0.95"/>
<circle cx="320" cy="200" r="34" fill="#ffb347" opacity="0.35"/>
<text x="350" y="130" fill="#fff" font-size="12">A 둥근 섬광 (밝은 주황 흰색)</text>
<text x="46" y="340" fill="#ddd" font-size="12">A 둥근 섬광: X=Y 크기 25, 수명 0.12초 (방향 없음)</text>
<text x="46" y="360" fill="#ddd" font-size="12">B 얇은 불꽃 6~8개: 방향 랜덤, 수명 0.2초</text>
<text x="46" y="378" fill="#889" font-size="11">→ 방향이 없어서 콤보로 연타해도 어색하지 않음</text>

<!-- 오른쪽: 연결 -->
<rect x="480" y="85" width="450" height="300" rx="10" fill="#1d2026" stroke="#3a3f48"/>
<text x="496" y="112" fill="#7ad0ff" font-size="15" font-weight="bold">② 연결 (위치 문제 해결)</text>
<g font-size="12" fill="#fff" text-anchor="middle">
<rect x="520" y="130" width="370" height="40" rx="6" fill="#26303f" stroke="#4a6a99"/><text x="705" y="155">AC_MeleeTrace › SweepSegment (Impact Point를 이미 앎)</text>
<rect x="520" y="195" width="370" height="40" rx="6" fill="#26303f" stroke="#4a6a99"/><text x="705" y="220">Take Damage 호출 뒤</text>
<rect x="520" y="260" width="370" height="40" rx="6" fill="#33402a" stroke="#7aa850"/><text x="705" y="285">Spawn Emitter at Location (위치 = Impact Point)</text>
<rect x="520" y="325" width="370" height="40" rx="6" fill="#40352a" stroke="#c9904a"/><text x="705" y="350">Template = P_HitSpot (Scale 1.0)</text>
</g>
<g stroke="#8899aa" stroke-width="2"><line x1="705" y1="170" x2="705" y2="195"/><line x1="705" y1="235" x2="705" y2="260"/><line x1="705" y1="300" x2="705" y2="325"/></g>

<!-- 아래: 콤보 -->
<rect x="30" y="405" width="900" height="185" rx="10" fill="#1d2026" stroke="#3a3f48"/>
<text x="46" y="432" fill="#9cf08a" font-size="15" font-weight="bold">③ 콤보 연타 때 크기</text>
<line x1="70" y1="520" x2="890" y2="520" stroke="#556" stroke-width="2"/>
<g>
<circle cx="150" cy="520" r="14" fill="#fff6d8"/><text x="150" y="552" fill="#ccc" font-size="12" text-anchor="middle">1타 Scale 1.0</text>
<circle cx="330" cy="520" r="14" fill="#fff6d8"/><text x="330" y="552" fill="#ccc" font-size="12" text-anchor="middle">2타 Scale 1.0</text>
<circle cx="510" cy="520" r="14" fill="#fff6d8"/><text x="510" y="552" fill="#ccc" font-size="12" text-anchor="middle">3타 Scale 1.0</text>
<circle cx="780" cy="500" r="40" fill="#fff6d8" opacity="0.9"/><circle cx="780" cy="500" r="55" fill="#ffb347" opacity="0.3"/>
<text x="780" y="572" fill="#ffd27a" font-size="12" text-anchor="middle">마지막 타·그로기 Scale 2.5</text>
</g>
<text x="46" y="458" fill="#ddd" font-size="12">평타는 작게(번잡 방지), 마지막 타나 그로기 순간에만 크게. 색 원칙: 보스 맞을 때 밝은 주황 흰색(빨강 제외).</text>
</svg>
